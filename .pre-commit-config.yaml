# Les hooks de ce catalogue. Ils mesurent ce qu'une relecture ne voit pas.
#
# `pass_filenames: false` partout : ces contrôles portent sur le dépôt entier,
# pas sur les fichiers d'un commit. Un lab retiré du `meta.yml` casse le
# catalogue sans qu'aucun fichier du commit ne le montre.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # LICENSE est EXCLUE des deux hooks d'espaces. Le texte d'une licence se
      # reconnaît au caractère près : GitHub l'identifie en le comparant, et
      # `end-of-file-fixer` lui retirait sa ligne finale à chaque passage.
      # Mesuré sur sept catalogues neufs : `git status` affichait `M LICENSE`
      # sans qu'aucun humain y ait touché.
      - id: trailing-whitespace
        exclude: '^LICENSE$'
      - id: end-of-file-fixer
        exclude: '^LICENSE$'
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: contrat-valide
        name: le contrat du catalogue est valide
        # `entry: dsoxlab …` emploierait le moteur du PATH, c'est-à-dire ce qui
        # traîne sur la machine du contributeur. `uvx` avec une borne prend une
        # version DÉCLARÉE, la même qu'en CI, et les guillemets sont
        # nécessaires : sans eux, la ligne recopiée dans un terminal crée un
        # fichier nommé `=0.5.0` par redirection.
        entry: uvx 'dsoxlab>=0.5.3' validate-structure
        language: system
        pass_filenames: false

      # Le verrou décrit ce qui s'installe, et c'est lui que les scanners de
      # vulnérabilités lisent. Un verrou qui dérive de son `pyproject.toml` ne
      # verrouille plus rien.
      #
      # PREMIER GESTE après la création du catalogue : `uv lock`. Le socle ne
      # peut pas produire ce fichier, puisque le résoudre demande le réseau ;
      # ce hook échouera donc jusqu'à ce que vous l'ayez lancé, et il le dira.
      - id: verrou-a-jour
        name: uv.lock décrit bien le pyproject
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: '^(pyproject\.toml|uv\.lock)$'

      - id: garde-fous
        name: les garde-fous du dépôt passent
        entry: uv run --with pytest --with pyyaml pytest tests/ -q
        language: system
        pass_filenames: false

      # Le `[tool.ruff]` du pyproject existait depuis l'origine, mais AUCUN
      # hook ne l'appelait : onze erreurs dormaient dans quatre labs, dont un
      # `zip()` sans `strict=` et une variable nommee `l`. Une configuration
      # que rien ne joue n'est pas une regle, c'est une intention.
      #
      # `--force-exclude` n'est pas une precaution : sans lui, l'exclusion
      # declaree dans le pyproject est IGNOREE pour tout fichier passe en
      # argument, et pre-commit passe justement les fichiers en argument.
      #
      # LA VERSION EST EPINGLEE, et declarer le jeu de regles n'y suffisait
      # pas. `uvx ruff` installe la DERNIERE version publiee : la machine et le
      # runner n'ont alors pas le meme juge. Mesure le 2026-10-27 : ruff 0.14.9
      # ici disait « All checks passed », ruff 0.17.3 en CI levait un PLW0108
      # dans `pub-haproxy-sante`. Le jeu `PLW` etait bien declare ; c'est la
      # version qui avait change d'avis, en ajoutant une regle A L'INTERIEUR du
      # jeu. Un lint qu'on ne peut pas rejouer ne se corrige qu'en poussant.
      - id: ruff
        name: ruff (lint du python des labs, des tests et des scripts)
        entry: uvx ruff@0.17.3 check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      # `scripts/gen_catalog.py --check` existait depuis l'origine et RIEN ne
      # l'appelait. Resultat mesure le 2026-10-25 : le catalogue des deux
      # README ignorait deux labs, et affichait en francais sept titres
      # anglais, faute de lab.fr.yaml. Un generateur dont personne ne verifie
      # la sortie produit une documentation qui derive en silence.
      - id: catalogue-a-jour
        name: le catalogue des README suit les labs
        entry: python3 scripts/gen_catalog.py --check
        language: system
        pass_filenames: false

      # Un playbook refuse AU CHARGEMENT ne joue aucune tache, et son message
      # ne nomme pas la ligne fautive. La cause la plus frequente est une
      # apostrophe francaise ou un `${#...}` dans un script shell embarque :
      # Ansible decoupe la chaine a la facon d'un shell, Jinja lit `{#` comme
      # un debut de commentaire. Le seul juge fiable est Ansible lui-meme,
      # d'ou ce controle plutot qu'un linter de plus.
      #
      # Il vaut surtout pour ce catalogue : ses 38 labs embarquent tous un
      # script de mise en situation, et decouvrir le defaut pendant une
      # campagne coute une VM et dix minutes.
      - id: playbooks-se-chargent
        name: tous les playbooks se chargent
        entry: python3 scripts/check-playbooks.py
        language: system
        pass_filenames: false

      # `pytest --collect-only` IMPORTE le module sans executer les corps de
      # fonctions : un nom manquant dans un corps passe la collecte et casse a
      # l'appel, c'est-a-dire pendant la campagne, sur une VM. Ce controle
      # cherche les noms qu'aucun import ni aucune affectation ne fournit.
      - id: tests-ont-leurs-noms
        name: les tests des labs ont tous leurs noms
        entry: python3 scripts/check-tests.py
        language: system
        pass_filenames: false

      # La règle d'écriture du projet interdit le tiret cadratin en français :
      # il se remplace par la ponctuation qui dit son rôle. Mesuré sur un
      # catalogue sans ce hook : 51 `lab.fr.yaml`, 172 README de labs et 86
      # scénarios en portaient un.
      - id: pas-de-tiret-cadratin
        name: ni emoji ni tiret cadratin dans ce que lit l'apprenant
        entry: python3 tests/outils/pas_de_tiret_cadratin.py
        language: system
        pass_filenames: false

      # Un verdict ne se commite pas avec ce qu'il mesure. Vecu le 2026-10-22
      # dans deux catalogues, et dans les DEUX SENS : une correction du code
      # partage commitee avec les verdicts qu'elle perimait est passee pour
      # saine, et des labs reattestes sur une branche sont ressortis « a
      # reattester » apres leur fusion en squash, contenu inchange.
      #
      # Le cas qui ne se rattrape JAMAIS : une PR squashee qui retouche un test
      # APRES sa campagne. Le commit unique porte les deux et le squash a
      # detruit ce qui les distinguait. Aucune mesure a posteriori ne peut le
      # voir, ni une date, ni un diff entre deux arbres. Il ne reste qu'a
      # l'empecher.
      - id: verdicts-et-commun-separes
        name: les verdicts ne sont pas commites avec ce qu'ils mesurent
        entry: python3 tests/outils/verdicts_et_commun_separes.py
        language: system
        pass_filenames: false

      # Le garde-fou ci-dessus est lui-meme eprouve, dans les DEUX sens :
      # quatorze cas, ceux qu'il doit refuser et ceux qu'il doit laisser
      # passer. Un garde-fou qui refuserait aussi les commits legitimes se
      # contourne au bout de deux jours, et ne controle alors plus rien.
      - id: garde-fou-des-verdicts-eprouve
        name: le garde-fou des verdicts juge dans les deux sens
        entry: uv run --no-project --with pytest --with pyyaml pytest tests/test_verdicts_et_commun_separes.py -q
        language: system
        pass_filenames: false
        always_run: true
