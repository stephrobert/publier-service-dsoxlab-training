---
- name: Défaire l'épreuve pub-epreuve-niveau-deux
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter et désactiver le backend
      ansible.builtin.systemd:
        name: pub-epreuve-niveau-deux-backend
        state: stopped
        enabled: false
      failed_when: false

    - name: Arrêter et supprimer les conteneurs de l'épreuve
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: /opt/pub-epreuve-niveau-deux
      failed_when: false
      changed_when: true

    - name: Supprimer les fichiers et le service de l'épreuve
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-epreuve-niveau-deux
        - /etc/systemd/system/pub-epreuve-niveau-deux-backend.service
        - /var/log/dsoxlab-pub-epreuve-niveau-deux.log

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 30
      loop:
        - 80
        - 443
        - 8082
        - 9090
        - 18087
