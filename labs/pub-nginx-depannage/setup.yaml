---
- name: Préparer le lab pub-nginx-depannage
  hosts: lab_target
  become: true
  tasks:
    - name: Installer Nginx depuis le dépôt de l'éditeur, version déclarée
      ansible.builtin.include_tasks: ../../shared/paquet-nginx.yml

    - name: Poser une pile saine, puis y injecter une panne
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        # Vide en usage normal : le script tire alors sa panne au hasard.
        # La validation la force pour éprouver les cinq.
        DSOXLAB_VARIANTE: "{{ lookup('env', 'DSOXLAB_VARIANTE') }}"

- name: Outils du client indépendant
  hosts: lab_client
  become: true
  tasks:
    - name: De quoi éprouver la recette depuis l'extérieur
      ansible.builtin.apt:
        name: [curl]
        state: present
        update_cache: true
        cache_valid_time: 3600
