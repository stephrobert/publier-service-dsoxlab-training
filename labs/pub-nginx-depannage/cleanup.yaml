---
- name: Défaire le lab pub-nginx-depannage
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter les trois backends
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - pub-nginx-depannage-app
        - pub-nginx-depannage-api
        - pub-nginx-depannage-imposteur
      failed_when: false

    - name: Arrêter Nginx
      ansible.builtin.systemd:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false

    - name: Retirer la ligne de résolution posée par le lab
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: 'dsoxlab-pub-nginx-depannage'
        state: absent

    - name: Retirer ce que le lab a déposé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-nginx-depannage
        - /etc/systemd/system/pub-nginx-depannage-app.service
        - /etc/systemd/system/pub-nginx-depannage-api.service
        - /etc/systemd/system/pub-nginx-depannage-imposteur.service
        - /etc/nginx/conf.d/publication.conf
        - /etc/nginx/conf.d/publication.conf
        - /etc/nginx/conf.d/notes-exploitation.conf
        - /etc/nginx/backend-ca.crt
        - /var/www/catalogue
        - /root/.variante-pub-nginx-depannage
        - /var/log/dsoxlab-pub-nginx-depannage.log

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop:
        - 80
        - 18101
        - 18102
        - 18103
