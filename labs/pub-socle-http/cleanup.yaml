---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
- name: Défaire le lab pub-socle-http
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter l'API
      ansible.builtin.systemd:
        name: pub-api.service
        state: stopped
      failed_when: false

    - name: Supprimer unité, fichiers, état et livrables de l'apprenant
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/pub-api.service
        - /opt/pub-http
        - /var/lib/pub-api
        - /home/student/README-api
        - /home/student/recette-http.yaml
        - /home/student/envoyer-commande.sh
        - /tmp/pub-socle-api.py
        - /var/log/dsoxlab-pub-socle-http.log

    - name: Retirer le compte de service du lab
      ansible.builtin.user:
        name: api
        state: absent

    - name: Recharger systemd
      ansible.builtin.systemd:
        daemon_reload: true
