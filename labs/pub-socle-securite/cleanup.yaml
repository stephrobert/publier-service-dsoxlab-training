---
- name: Défaire le lab pub-socle-securite
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter le garde et l'application
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop:
        - pub-securite-garde
        - pub-securite-app

    - name: Retirer un éventuel filtrage posé pendant le lab
      ansible.builtin.shell:
        cmd: |
          while iptables -D INPUT -p tcp --dport 18090 -j REJECT 2>/dev/null; do :; done
          while iptables -D INPUT -p tcp --dport 18090 -j DROP 2>/dev/null; do :; done
          exit 0
        executable: /bin/bash
      changed_when: false

    - name: Supprimer les fichiers du lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-socle-securite
        - /home/student/identites.txt
        - /etc/systemd/system/pub-securite-garde.service
        - /etc/systemd/system/pub-securite-app.service
        - /var/log/dsoxlab-pub-socle-securite.log

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop:
        - 80
        - 18090
