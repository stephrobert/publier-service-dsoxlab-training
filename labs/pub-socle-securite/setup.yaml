---
- name: Préparer le lab pub-socle-securite
  hosts: lab_target
  become: true
  tasks:
    - name: De quoi lire une politique et filtrer un port
      ansible.builtin.apt:
        name: [python3-yaml, iptables, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Déposer l'application métier
      ansible.builtin.copy:
        src: fixtures/application.py
        dest: /tmp/pub-securite-application.py
        mode: "0644"

    - name: Déposer le garde paramétrable
      ansible.builtin.copy:
        src: fixtures/garde.py
        dest: /tmp/pub-securite-garde.py
        mode: "0644"

    - name: Poser la situation, sans aucune politique
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash

- name: Outils du client indépendant
  hosts: lab_client
  become: true
  tasks:
    - name: De quoi envoyer des requêtes adverses
      ansible.builtin.apt:
        name: [curl]
        state: present
        update_cache: true
        cache_valid_time: 3600
