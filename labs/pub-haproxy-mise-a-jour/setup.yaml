---
- name: Préparer le lab pub-haproxy-mise-a-jour
  hosts: lab_target
  become: true
  tasks:
    - name: Installer HAProxy depuis le dépôt de l'éditeur, version déclarée
      ansible.builtin.include_tasks: ../../shared/paquet-haproxy.yml

    - name: Poser deux générations, et rien pour passer de l'une à l'autre
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash

- name: Outils du client indépendant
  hosts: lab_client
  become: true
  tasks:
    - name: De quoi interroger le service depuis l'extérieur
      ansible.builtin.apt:
        name: [curl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Une sonde courte, qui écrit un code par ligne
      ansible.builtin.copy:
        dest: /usr/local/bin/sonde-courte
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # sonde-courte <ip> <fichier> [nombre]
          #
          # Une requête toutes les 200 ms, un code par ligne, puis « fin ».
          # Le fichier est vidé à chaque ligne : le test lit pendant que la
          # sonde écrit, et une ligne retenue dans un tampon serait une
          # mesure perdue.
          import http.client
          import sys
          import time

          ip = sys.argv[1]
          destination = sys.argv[2]
          nombre = int(sys.argv[3]) if len(sys.argv) > 3 else 100

          with open(destination, "w", buffering=1) as sortie:
              for _ in range(nombre):
                  try:
                      liaison = http.client.HTTPConnection(ip, 80, timeout=5)
                      liaison.request("GET", "/")
                      reponse = liaison.getresponse()
                      reponse.read()
                      sortie.write(f"{reponse.status}\n")
                      liaison.close()
                  except OSError as souci:
                      sortie.write(f"erreur {type(souci).__name__}\n")
                  time.sleep(0.2)
              sortie.write("fin\n")

    - name: Un flux long, qui note la génération qui le sert
      ansible.builtin.copy:
        dest: /usr/local/bin/flux-long
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # flux-long <ip> <fichier>
          #
          # Ouvre /flux et écrit chaque ligne reçue. La première nomme la
          # génération qui a pris la connexion : c'est elle qui permet de
          # dire si un flux établi a survécu à la bascule, et chez qui.
          import http.client
          import sys

          ip, destination = sys.argv[1], sys.argv[2]
          with open(destination, "w", buffering=1) as sortie:
              try:
                  liaison = http.client.HTTPConnection(ip, 80, timeout=200)
                  liaison.request("GET", "/flux")
                  reponse = liaison.getresponse()
                  while True:
                      ligne = reponse.fp.readline()
                      if not ligne:
                          break
                      sortie.write(ligne.decode("utf-8", "replace"))
              except OSError as souci:
                  sortie.write(f"erreur: {souci}\n")
              sortie.write("fin\n")
