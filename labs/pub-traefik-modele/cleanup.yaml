---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
- name: Défaire le lab pub-traefik-modele
  hosts: lab_target
  become: true
  tasks:
    - name: Supprimer les conteneurs du lab
      ansible.builtin.command:
        cmd: docker rm -f pub-modele-traefik pub-modele-app-a pub-modele-app-b
      failed_when: false
      changed_when: true

    - name: Supprimer le réseau Docker du lab
      ansible.builtin.command:
        cmd: docker network rm pub-modele
      failed_when: false
      changed_when: true

    - name: Supprimer les fichiers du lab
      ansible.builtin.file:
        path: /opt/pub-modele
        state: absent

    - name: Vérifier que le port du proxy est libéré
      ansible.builtin.wait_for:
        port: 80
        host: 127.0.0.1
        state: stopped
        timeout: 30
