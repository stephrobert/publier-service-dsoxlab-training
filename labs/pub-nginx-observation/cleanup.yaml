---
- name: Défaire le lab pub-nginx-observation
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter et désactiver le backend
      ansible.builtin.systemd:
        name: pub-nginx-observation-backend
        state: stopped
        enabled: false
      failed_when: false

    - name: Arrêter Nginx
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: /opt/pub-nginx-observation
      failed_when: false
      changed_when: true

    - name: Supprimer les fichiers du lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-nginx-observation
        - /etc/systemd/system/pub-nginx-observation-backend.service
        - /var/log/dsoxlab-pub-nginx-observation.log

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop:
        - 80
        - 8081
        - 18085
