---
- name: Défaire le lab pub-traefik-mise-a-jour
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter et désactiver le backend
      ansible.builtin.systemd:
        name: pub-mise-a-jour-backend
        state: stopped
        enabled: false
      failed_when: false

    - name: Arrêter et supprimer Traefik
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: /opt/pub-mise-a-jour
      failed_when: false
      changed_when: true

    - name: Supprimer les fichiers du lab et la trace
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-mise-a-jour
        - /etc/systemd/system/pub-mise-a-jour-backend.service
        - /var/log/dsoxlab-pub-mise-a-jour.log

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports du lab sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 30
      loop:
        - 80
        - 18086
