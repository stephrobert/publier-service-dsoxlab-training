---
# Joué par `dsoxlab run` avant d'ouvrir la session.
- name: Préparer le lab pub-01-acme-pebble
  hosts: lab_target
  become: true
  tasks:
    - name: Installer la couche machine (Docker, Compose, outils)
      ansible.builtin.include_tasks: ../../shared/machine-docker.yml

    - name: Lire les versions et digests épinglés
      ansible.builtin.include_vars:
        file: ../../shared/images.yml
        name: socle_images

    - name: Poser la situation du lab
      # La trace va dans /var/log/dsoxlab-prepare.log sur la machine.
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        IMG_PEBBLE: "{{ socle_images.pebble.image }}:{{ socle_images.pebble.version }}@{{ socle_images.pebble.digest }}"
        IMG_CHALLTESTSRV: "{{ socle_images.challtestsrv.image }}:{{ socle_images.challtestsrv.version }}@{{ socle_images.challtestsrv.digest }}"
        IMG_LEGO: "{{ socle_images.lego.image }}:{{ socle_images.lego.version }}@{{ socle_images.lego.digest }}"
