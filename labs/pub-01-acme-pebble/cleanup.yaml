---
# Joué par `dsoxlab clean` : rien ne doit rester, volumes et réseaux compris.
- name: Nettoyer le lab pub-01-acme-pebble
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter ce que l'apprenant a monté
      ansible.builtin.command:
        cmd: docker compose down -v --remove-orphans
        chdir: /opt/pub-lab
      changed_when: true
      failed_when: false

    - name: Retirer les conteneurs Pebble et lego restés hors Compose
      ansible.builtin.shell:
        cmd: |
          ids=$(for i in ghcr.io/letsencrypt/pebble ghcr.io/letsencrypt/pebble-challtestsrv goacme/lego; do docker ps -aq --filter "ancestor=$i"; done)
          [ -n "$ids" ] && docker rm -f $ids || true
        executable: /bin/bash
      changed_when: true
      failed_when: false

    - name: Retirer le répertoire de travail et la trace
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-lab
        - /var/log/dsoxlab-prepare.log

    - name: Vérifier que rien n'écoute plus sur les ports du lab
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop: [14000, 15000, 5002]
