---
- name: Défaire le lab pub-nginx-limites
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter l'API
      ansible.builtin.systemd:
        name: pub-nginx-limites-api
        state: stopped
        enabled: false
      failed_when: false

    - name: Arrêter Nginx
      ansible.builtin.systemd:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false

    - name: Retirer ce que le lab a déposé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-nginx-limites
        - /etc/systemd/system/pub-nginx-limites-api.service
        - /etc/nginx/conf.d/limites.conf
        - /etc/nginx/conf.d/limites.conf
        - /var/log/dsoxlab-pub-nginx-limites.log

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop:
        - 80
        - 18098
