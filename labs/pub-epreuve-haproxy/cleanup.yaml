---
# Joué par `dsoxlab clean` et `dsoxlab reset`. Les paquets restent installés ;
# partent les services, l'instance en panne, la plateforme ACME, les
# certificats, la configuration de HAProxy, les sauvegardes et les livrables de
# l'apprenant.
- name: Défaire le lab pub-epreuve-haproxy sur l'edge
  hosts: lab_target
  become: true
  tasks:
    - name: Retirer le réglage de resolved posé par le banc
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d/pub-epreuve-haproxy.conf
        state: absent
      register: resolved_banc

    - name: Recharger resolved si son réglage a été retiré
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
      when: resolved_banc.changed

    - name: Arrêter les services, l'instance en panne et la relance de la plateforme
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - pub-epreuve-haproxy-catalogue
        - pub-epreuve-haproxy-notifications
        - pub-epreuve-haproxy-archives
        - pub-epreuve-haproxy-archives-backends
        - pub-epreuve-haproxy-acme
      failed_when: false

    - name: Arrêter HAProxy et le laisser comme il a été trouvé
      ansible.builtin.systemd:
        name: haproxy
        state: stopped
        enabled: false
      failed_when: false

    - name: Défaire la plateforme ACME
      ansible.builtin.command: >-
        docker compose -f /opt/pub-traefik-acme/platform.yaml down
      changed_when: true
      failed_when: false

    - name: Retirer le réseau de la plateforme
      ansible.builtin.command: docker network rm acme-renewal
      changed_when: true
      failed_when: false

    - name: Retirer ce que le lab a déposé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-epreuve-haproxy
        - /opt/pub-epreuve-haproxy-archives
        - /opt/pub-traefik-acme
        - /etc/pub-epreuve-haproxy-archives
        - /var/lib/pub-epreuve-haproxy
        - /var/backups/pub-epreuve-haproxy
        - /root/.pub-epreuve-haproxy-secret.yaml
        - /etc/systemd/system/pub-epreuve-haproxy-catalogue.service
        - /etc/systemd/system/pub-epreuve-haproxy-notifications.service
        - /etc/systemd/system/pub-epreuve-haproxy-archives.service
        - /etc/systemd/system/pub-epreuve-haproxy-archives-backends.service
        - /etc/systemd/system/pub-epreuve-haproxy-acme.service
        - /etc/tmpfiles.d/pub-epreuve-haproxy.conf
        - /etc/haproxy/certs
        - /run/haproxy
        - /run/pub-epreuve-haproxy-archives.sock
        - /run/pub-epreuve-haproxy-archives.pid
        - /home/student/README-epreuve
        - /home/student/incident.yaml
        - /tmp/pub-epreuve-haproxy-services.py
        - /tmp/pub-epreuve-haproxy-incident.py
        - /var/log/dsoxlab-pub-epreuve-haproxy.log
        - /var/log/dsoxlab-pub-traefik-acme.log

    - name: Retirer la résolution du backend de l'instance en panne
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: 'dsoxlab-pub-epreuve-haproxy'
        state: absent

    - name: HAProxy est-il seulement installé ?
      # Après un retour à la base figée, la VM n'a jamais vu HAProxy :
      # /etc/haproxy n'existe pas, et réécrire une configuration dedans
      # échoue sur « Destination directory does not exist ». Un nettoyage ne
      # remet en état que ce qui existe.
      ansible.builtin.stat:
        path: /etc/haproxy
      register: dossier_haproxy

    - name: Ramener la configuration à un fichier sans mission
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        content: |
          global
              log /dev/log local0
              chroot /var/lib/haproxy
              user haproxy
              group haproxy
              daemon

          defaults
              log     global
              option  dontlognull
              timeout connect 5s
              timeout client  30s
              timeout server  30s
      when: dossier_haproxy.stat.exists

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop: [80, 443, 8088, 9101, 14000, 15000, 18301, 18302]

- name: Défaire le lab pub-epreuve-haproxy sur le client
  hosts: lab_client
  become: true
  tasks:
    - name: Retirer la racine de l'autorité de test et la sonde de rafale
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /home/student/racine-acme.pem
        - /tmp/racine-acme-epreuve.pem
        - /usr/local/bin/rafale
