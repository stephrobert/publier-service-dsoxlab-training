---
- name: Défaire le lab pub-haproxy-depannage
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter les services du lab
      ansible.builtin.systemd:
        name: "pub-haproxy-depannage-{{ item }}"
        state: stopped
        enabled: false
      loop: [app, sonde-cassee, api, imposteur, ventouse]
      failed_when: false

    - name: Arrêter HAProxy et le laisser comme il a été trouvé
      ansible.builtin.systemd:
        name: haproxy
        state: stopped
        enabled: false
      failed_when: false

    - name: Retirer la ligne de résolution du lab
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: 'dsoxlab-pub-haproxy-depannage'
        state: absent

    - name: Retirer ce que le lab a déposé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-haproxy-depannage
        - /etc/systemd/system/pub-haproxy-depannage-app.service
        - /etc/systemd/system/pub-haproxy-depannage-sonde-cassee.service
        - /etc/systemd/system/pub-haproxy-depannage-api.service
        - /etc/systemd/system/pub-haproxy-depannage-imposteur.service
        - /etc/systemd/system/pub-haproxy-depannage-ventouse.service
        - /etc/tmpfiles.d/pub-haproxy-depannage.conf
        - /etc/haproxy/notes-exploitation.txt
        - /root/.variante-pub-haproxy-depannage
        - /run/haproxy
        - /var/log/dsoxlab-pub-haproxy-depannage.log

    - name: HAProxy est-il seulement installé ?
      # Apres un retour a la base figee, la VM n'a jamais vu HAProxy :
      # /etc/haproxy n'existe pas, et reecrire une configuration dedans
      # echoue sur « Destination directory does not exist ». Un nettoyage ne
      # remet en etat que ce qui existe.
      ansible.builtin.stat:
        path: /etc/haproxy
      register: dossier_haproxy

    - name: Ramener la configuration à un fichier sans mission
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        content: |
          global
              log /dev/log local0
              chroot /var/lib/haproxy
              user haproxy
              group haproxy
              daemon

          defaults
              log     global
              option  dontlognull
              timeout connect 5s
              timeout client  30s
              timeout server  30s
      when: dossier_haproxy.stat.exists
    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop: [80, 8081, 8404, 18201, 18202, 18203, 18204]
