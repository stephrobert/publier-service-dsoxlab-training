---
# Joué par `dsoxlab clean` et `dsoxlab reset` : il défait ce que setup.yaml a
# posé, pour que le lab se rejoue à l'identique.
- name: Défaire le lab pub-traefik-restart-recovery
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter le service du lab
      ansible.builtin.command:
        cmd: docker compose down -v --remove-orphans
        chdir: /opt/pub-restart
      failed_when: false
      changed_when: true

    - name: Retirer les conteneurs résiduels
      ansible.builtin.command:
        cmd: docker rm -f pub-restart-whoami
      failed_when: false
      changed_when: true

    - name: Supprimer le répertoire de travail et le journal de préparation
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-restart
        - /var/log/dsoxlab-pub-restart.log

    - name: Vérifier que le port du service est libéré
      ansible.builtin.wait_for:
        port: 18080
        host: 127.0.0.1
        state: stopped
        timeout: 30
