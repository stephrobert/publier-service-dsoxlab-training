id: pub-traefik-restart-recovery
title: "Keep a containerized web service available after a Docker restart"
section: traefik
level: niveau-1
description: |
  Configure a containerized web service to restart automatically with Docker
  and verify that the real HTTP endpoint recovers after the daemon restarts.
skills:
  - docker
  - docker-compose
  - service-reliability
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/services/reseau/traefik-installation/
lab_type: lab
estimated_time: "30m"
runtime:
  type: vm
  targets:
    - name: cible
      host: edge.lab
      label_en: "Debian 13"
      label_fr: "Debian 13"
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
