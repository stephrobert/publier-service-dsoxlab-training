---
- name: Préparer le lab pub-haproxy-flux-delais
  hosts: lab_target
  become: true
  tasks:
    - name: Installer HAProxy depuis le dépôt de l'éditeur, version déclarée
      ansible.builtin.include_tasks: ../../shared/paquet-haproxy.yml

    - name: Déposer les backends
      ansible.builtin.copy:
        src: fixtures/backends.py
        dest: /tmp/pub-flux-delais-backends.py
        mode: "0644"

    - name: Poser un proxy dont toutes les bornes valent la même chose
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash

- name: Outils du client indépendant
  hosts: lab_client
  become: true
  tasks:
    - name: De quoi interroger le service depuis l'extérieur
      ansible.builtin.apt:
        name: [curl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Un client WebSocket, qui se tait puis reparle
      ansible.builtin.copy:
        dest: /usr/local/bin/client-ws
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # client-ws <ip> <silence>
          #
          # Établit la poignée de main, échange un message, SE TAIT pendant
          # <silence> secondes, puis échange de nouveau. Le silence est le
          # sujet : c'est lui qu'une borne d'inactivité coupe, et un client
          # bavard ne le mesurerait jamais.
          import base64
          import os
          import socket
          import sys

          ip, silence = sys.argv[1], float(sys.argv[2])
          cle = base64.b64encode(os.urandom(16)).decode()


          def envoyer(prise, texte):
              charge = texte.encode()
              masque = os.urandom(4)
              corps = bytes(o ^ masque[i % 4] for i, o in enumerate(charge))
              prise.sendall(
                  b"\x81" + bytes([0x80 | len(charge)]) + masque + corps
              )


          try:
              with socket.create_connection((ip, 80), timeout=30) as prise:
                  prise.sendall(
                      (
                          "GET /ws HTTP/1.1\r\n"
                          f"Host: {ip}\r\n"
                          "Upgrade: websocket\r\n"
                          "Connection: Upgrade\r\n"
                          "Sec-WebSocket-Version: 13\r\n"
                          f"Sec-WebSocket-Key: {cle}\r\n\r\n"
                      ).encode()
                  )
                  entete = prise.recv(4096)
                  print("POIGNEE", "ok" if b"101" in entete else "ko")
                  if b"101" not in entete:
                      print("DETAIL", entete[:160])
                      sys.exit(0)

                  prise.settimeout(30)
                  envoyer(prise, "debut")
                  print("DEBUT", prise.recv(4096)[2:].decode("utf-8", "replace"))

                  prise.settimeout(silence + 30)
                  import time

                  time.sleep(silence)
                  envoyer(prise, "apres")
                  print("APRES", prise.recv(4096)[2:].decode("utf-8", "replace"))
          except OSError as souci:
              print(f"ERREUR {type(souci).__name__}: {souci}")

    - name: Un lecteur de flux d'événements, qui horodate ce qu'il reçoit
      ansible.builtin.copy:
        dest: /usr/local/bin/flux-sse
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # flux-sse <ip> <chemin> <duree-max>
          #
          # Affiche « <secondes-depuis-le-debut> <charge> » par événement
          # reçu, puis « fin ». L'horodatage de RECEPTION est ce qui compte :
          # celui que l'application met dans l'événement ne dit pas quand le
          # proxy l'a laissé passer.
          import http.client
          import sys
          import time

          ip, chemin, duree = sys.argv[1], sys.argv[2], float(sys.argv[3])
          debut = time.monotonic()
          try:
              liaison = http.client.HTTPConnection(ip, 80, timeout=duree + 30)
              liaison.request("GET", chemin)
              reponse = liaison.getresponse()
              print(f"STATUT {reponse.status}")
              while time.monotonic() - debut < duree + 10:
                  ligne = reponse.fp.readline()
                  if not ligne:
                      break
                  texte = ligne.decode("utf-8", "replace").strip()
                  if texte.startswith("data: "):
                      print(f"{time.monotonic() - debut:.1f} {texte[6:]}")
          except OSError as souci:
              print(f"ERREUR {type(souci).__name__}: {souci}")
          print("fin")

    - name: Un écrivain qui n'écrit qu'une fois
      ansible.builtin.copy:
        dest: /usr/local/bin/ecrire-une-fois
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # ecrire-une-fois <ip> <route>
          #
          # UNE requête d'écriture, et une seule. Le service ferme sans
          # répondre : la perte de réponse est donc attendue, et ce n'est
          # pas elle qu'on mesure. Ce qu'on mesure est ailleurs, dans le
          # compteur métier du backend.
          import http.client
          import sys

          ip, route = sys.argv[1], sys.argv[2]
          try:
              liaison = http.client.HTTPConnection(ip, 80, timeout=60)
              liaison.request("POST", route, body=b"charge")
              reponse = liaison.getresponse()
              print(f"REPONSE {reponse.status}")
          except (OSError, http.client.HTTPException) as souci:
              print(f"PERDUE {type(souci).__name__}")
