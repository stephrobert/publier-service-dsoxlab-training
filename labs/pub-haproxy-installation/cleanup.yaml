---
- name: Défaire le lab pub-haproxy-installation
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter les trois services du lab
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - pub-haproxy-installation-a
        - pub-haproxy-installation-b
        - pub-haproxy-installation-lignes
      failed_when: false

    - name: Arrêter HAProxy et le laisser comme il a été trouvé
      ansible.builtin.systemd:
        name: haproxy
        state: stopped
        enabled: false
      failed_when: false

    - name: Retirer ce que le lab a déposé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-haproxy-installation
        - /etc/systemd/system/pub-haproxy-installation-a.service
        - /etc/systemd/system/pub-haproxy-installation-b.service
        - /etc/systemd/system/pub-haproxy-installation-lignes.service
        - /run/haproxy
        - /var/log/dsoxlab-pub-haproxy-installation.log

    # La configuration n'est pas supprimée mais ramenée à un fichier sans
    # listener : un `/etc/haproxy/haproxy.cfg` absent ferait échouer le
    # paquet au prochain démarrage, et le lab aurait abîmé la machine en
    # partant.
    - name: HAProxy est-il seulement installé ?
      # Apres un retour a la base figee, la VM n'a jamais vu HAProxy :
      # /etc/haproxy n'existe pas, et reecrire une configuration dedans
      # echoue sur « Destination directory does not exist ». Un nettoyage ne
      # remet en etat que ce qui existe.
      ansible.builtin.stat:
        path: /etc/haproxy
      register: dossier_haproxy

    - name: Ramener la configuration à un fichier sans mission
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        owner: root
        group: root
        mode: "0644"
        content: |
          global
              log /dev/log local0
              chroot /var/lib/haproxy
              user haproxy
              group haproxy
              daemon

          defaults
              log     global
              option  dontlognull
              timeout connect 5s
              timeout client  30s
              timeout server  30s
      when: dossier_haproxy.stat.exists
    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop:
        - 80
        - 7001
        - 8404
        - 18121
        - 18122
        - 18123
