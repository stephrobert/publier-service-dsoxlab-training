---
# Joué par `dsoxlab run` avant d'ouvrir la session.
#
# Tout tourne sur edge.lab, en boucle locale : le client de mesure fourni
# tourne sur ce même hôte, aucun client distinct n'est nécessaire.
- name: Préparer l'hôte edge du lab pub-socle-flux-longs
  hosts: lab_target
  become: true
  tasks:
    - name: Déposer le producteur et le service
      ansible.builtin.copy:
        src: fixtures/app.py
        dest: /tmp/pub-flux-app.py
        mode: "0644"

    - name: Déposer le client de mesure fourni
      ansible.builtin.copy:
        src: fixtures/mesure_flux.py
        dest: /tmp/pub-flux-mesure.py
        mode: "0755"

    - name: Poser la situation initiale
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
