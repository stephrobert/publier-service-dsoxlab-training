id: pub-socle-flux-longs
title: "Observe a WebSocket and an event stream"
section: socle
level: niveau-1
description: |
  A notification service exposes a WebSocket and a Server-Sent Events
  stream, both run honestly through a single configuration with four
  injected mistakes: an echo delay that makes every WebSocket round trip
  look broken, an SSE buffer that holds every event until the stream
  itself ends, a heartbeat interval that never actually fires, and a
  backend failure that the stream neither closes nor explains. A
  protocol-aware measuring client is provided to observe each of these
  the way they actually happen: by timing, not by reading a final body.
skills:
  - websocket-handshake
  - server-sent-events
  - stream-backpressure
  - backend-failure-signaling
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/services/web/flux-longs-protocoles/
lab_type: lab
estimated_time: "45m"
runtime:
  type: vm
  targets:
    - name: cible
      host: edge.lab
      label_en: "Debian 13"
      label_fr: "Debian 13"
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
