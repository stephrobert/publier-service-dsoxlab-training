---
- name: Défaire le lab pub-traefik-observabilite
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter et désactiver le backend
      ansible.builtin.systemd:
        name: pub-observabilite-backend
        state: stopped
        enabled: false
      failed_when: false

    - name: Arrêter et supprimer les conteneurs du lab
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: /opt/pub-observabilite
      failed_when: false
      changed_when: true

    - name: Arrêter le backend et supprimer les fichiers du lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-observabilite
        - /etc/systemd/system/pub-observabilite-backend.service
        - /var/log/dsoxlab-pub-observabilite.log

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports du lab sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 30
      loop:
        - 80
        - 8082
        - 9090
