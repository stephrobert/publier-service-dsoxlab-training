---
- name: Défaire le lab pub-socle-cache-delais
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter la passerelle et l'application
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      failed_when: false
      loop:
        - pub-cache-passerelle
        - pub-cache-app

    - name: Supprimer les fichiers du lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-socle-cache-delais
        - /home/student/identites-cache.txt
        - /etc/systemd/system/pub-cache-passerelle.service
        - /etc/systemd/system/pub-cache-app.service
        - /var/log/dsoxlab-pub-socle-cache-delais.log

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop:
        - 80
        - 18091
