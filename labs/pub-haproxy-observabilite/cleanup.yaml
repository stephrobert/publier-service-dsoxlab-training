---
- name: Défaire le lab pub-haproxy-observabilite
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter et désactiver le backend
      ansible.builtin.systemd:
        name: pub-haproxy-observabilite-backend
        state: stopped
        enabled: false
      failed_when: false

    - name: Arrêter HAProxy et Prometheus
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: /opt/pub-haproxy-observabilite
      failed_when: false
      changed_when: true

    - name: Supprimer les fichiers du lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-haproxy-observabilite
        - /etc/systemd/system/pub-haproxy-observabilite-backend.service
        - /var/log/dsoxlab-pub-haproxy-observabilite.log

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop:
        - 80
        - 8404
        - 9090
        - 18085
