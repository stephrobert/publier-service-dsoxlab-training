---
- name: Préparer le lab pub-haproxy-sante
  hosts: lab_target
  become: true
  tasks:
    - name: Installer HAProxy depuis le dépôt de l'éditeur, version déclarée
      ansible.builtin.include_tasks: ../../shared/paquet-haproxy.yml

    - name: Poser deux backends pilotables, et un HAProxy sans sondes
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash

- name: Outils du client indépendant
  hosts: lab_client
  become: true
  tasks:
    - name: De quoi interroger le service depuis l'extérieur
      ansible.builtin.apt:
        name: [curl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Un échantillonneur, qui dit QUI a répondu et ce qui a échoué
      ansible.builtin.copy:
        dest: /usr/local/bin/echantillon
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # echantillon <ip> <n>
          #
          # Envoie n requêtes et affiche « <cle> <compte> » par ligne. La clé
          # est le nom du service qui a répondu, ou « erreur-<code> ».
          #
          # Pourquoi un exécutable plutôt qu'une boucle shell dans le test :
          # la mesure est un comptage, et une boucle `curl | sort | uniq -c`
          # traversée par trois niveaux de quoting est le genre de code qui
          # échoue en rendant un résultat plausible.
          import collections
          import http.client
          import sys

          ip, nombre = sys.argv[1], int(sys.argv[2])
          comptes = collections.Counter()
          for _ in range(nombre):
              try:
                  liaison = http.client.HTTPConnection(ip, 80, timeout=10)
                  liaison.request("GET", "/")
                  reponse = liaison.getresponse()
                  corps = reponse.read().decode("utf-8", "replace")
                  if reponse.status != 200:
                      comptes[f"erreur-{reponse.status}"] += 1
                  else:
                      premiere = corps.splitlines()[0] if corps else ""
                      comptes[premiere.split()[-1] if premiere else "vide"] += 1
                  liaison.close()
              except OSError as souci:
                  comptes[f"erreur-{type(souci).__name__}"] += 1
          for cle, compte in sorted(comptes.items()):
              print(f"{cle} {compte}")

    - name: Un flux long, qui s'annonce dès sa première ligne
      ansible.builtin.copy:
        dest: /usr/local/bin/flux-long
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          # flux-long <ip> <fichier>
          #
          # Ouvre /lent et écrit chaque ligne reçue dans le fichier, vidée
          # aussitôt. La première ligne nomme le serveur qui a pris la
          # connexion : c'est elle qui permet de drainer LE BON.
          import http.client
          import sys

          ip, destination = sys.argv[1], sys.argv[2]
          with open(destination, "w", buffering=1) as sortie:
              try:
                  liaison = http.client.HTTPConnection(ip, 80, timeout=60)
                  liaison.request("GET", "/lent")
                  reponse = liaison.getresponse()
                  while True:
                      ligne = reponse.fp.readline()
                      if not ligne:
                          break
                      sortie.write(ligne.decode("utf-8", "replace"))
              except OSError as souci:
                  sortie.write(f"erreur: {souci}\n")
              sortie.write("fin\n")
