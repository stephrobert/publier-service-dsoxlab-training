---
title: "Sonder, retirer et drainer des backends"
description: |
  Mettre des sondes representatives devant deux backends, prouver qu'un backend
  vivant mais non pret est retire dans la fenetre prevue, qu'une baisse plus
  courte que le seuil ne retire rien, et que le drainage arrete les nouvelles
  affectations sans couper un flux etabli.
