title: "Basculer une version de backend, prouver le retour arrière et nommer le vrai domaine de panne"
description: |
  Déplacez le trafic réel d'une version de backend vers une candidate avec
  des erreurs bornées, retirez une candidate malsaine de la rotation et
  revenez en arrière, prouvez quelle panne un point d'entrée redondant
  survit réellement et laquelle il ne survit pas, et corrigez un outil de
  rotation de certificat pour que deux points d'entrée partageant le même
  stockage de certificat ne servent jamais une paire corrompue ou
  dépareillée.

