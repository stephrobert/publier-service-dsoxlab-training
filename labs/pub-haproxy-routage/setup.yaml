---
- name: Préparer le lab pub-haproxy-routage
  hosts: lab_target
  become: true
  tasks:
    - name: Installer HAProxy depuis le dépôt de l'éditeur, version déclarée
      ansible.builtin.include_tasks: ../../shared/paquet-haproxy.yml

    - name: Poser HAProxy en service, quatre backends sains, et un routage faux
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash

- name: Outils du client indépendant
  hosts: lab_client
  become: true
  tasks:
    - name: De quoi interroger le service depuis l'extérieur
      ansible.builtin.apt:
        name: [curl]
        state: present
        update_cache: true
        cache_valid_time: 3600
