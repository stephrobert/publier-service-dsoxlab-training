---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
- name: Préparer le lab pub-socle-service
  hosts: lab_target
  become: true
  tasks:
    - name: Déposer l'application et sa dépendance
      ansible.builtin.copy:
        src: "fixtures/{{ item.src }}"
        dest: "/tmp/{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: app.py, dest: pub-socle-app.py }
        - { src: stock.py, dest: pub-socle-stock.py }

    - name: Poser la situation initiale
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
