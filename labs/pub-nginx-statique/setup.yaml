---
- name: Préparer le lab pub-nginx-statique
  hosts: lab_target
  become: true
  tasks:
    - name: Installer Nginx depuis le dépôt de l'éditeur, version déclarée
      ansible.builtin.include_tasks: ../../shared/paquet-nginx.yml

    - name: Poser le site, l'API et la configuration sans distinction
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash

- name: Outils du client indépendant
  hosts: lab_client
  become: true
  tasks:
    - name: De quoi lire types et corps des réponses
      ansible.builtin.apt:
        name: [curl]
        state: present
        update_cache: true
        cache_valid_time: 3600
