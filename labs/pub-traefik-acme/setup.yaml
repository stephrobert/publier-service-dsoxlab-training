---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
- name: Préparer le lab pub-traefik-acme
  hosts: lab_target
  become: true
  tasks:
    - name: Installer la couche machine (Docker, Compose, outils)
      ansible.builtin.include_tasks: ../../shared/machine-docker.yml

    - name: Lire les versions et digests épinglés
      ansible.builtin.include_vars:
        file: ../../shared/images.yml
        name: socle_images

    - name: Poser l'autorité ACME de test
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        IMG_TRAEFIK: "{{ socle_images.traefik.image }}:{{ socle_images.traefik.version }}@{{ socle_images.traefik.digest }}"
        IMG_WHOAMI: "{{ socle_images.whoami.image }}:{{ socle_images.whoami.version }}@{{ socle_images.whoami.digest }}"
        IMG_PEBBLE: "{{ socle_images.pebble.image }}:{{ socle_images.pebble.version }}@{{ socle_images.pebble.digest }}"
        IMG_CHALLTESTSRV: "{{ socle_images.challtestsrv.image }}:{{ socle_images.challtestsrv.version }}@{{ socle_images.challtestsrv.digest }}"
