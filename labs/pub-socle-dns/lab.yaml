id: pub-socle-dns
title: "Diagnose and switch a DNS record safely"
section: socle
level: niveau-1
description: |
  Move a site from one version to another by changing its DNS records: find
  which server is authoritative and which one only caches, read a TTL, notice
  the forgotten AAAA record, then switch over and back without waiting for
  caches.
skills:
  - dns
  - ttl-and-cache
  - ipv6-records
distros:
  - debian13
doc_url: https://www.stephane-robert.info/docs/services/web/dns-preparer-bascule/
lab_type: lab
estimated_time: "45m"
runtime:
  type: vm
  targets:
    - name: cible
      host: edge.lab
      label_en: "Debian 13"
      label_fr: "Debian 13"
      roles:
        client: poste.lab
  default: cible
validation:
  functional: true
  persistence_after_reboot: false
