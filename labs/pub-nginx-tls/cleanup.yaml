---
- name: Défaire le lab pub-nginx-tls
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter le backend
      ansible.builtin.systemd:
        name: pub-nginx-tls-backend
        state: stopped
        enabled: false
      failed_when: false

    - name: Arrêter l'autorité locale
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: /opt/pub-nginx-tls
      failed_when: false
      changed_when: true

    - name: Arrêter Nginx
      ansible.builtin.systemd:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false

    - name: Retirer ce que le lab a déposé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-nginx-tls
        - /usr/local/bin/renouveler-certificats
        - /etc/systemd/system/pub-nginx-tls-backend.service
        - /etc/nginx/conf.d/tls.conf
        - /etc/nginx/conf.d/tls.conf
        - /var/log/dsoxlab-pub-nginx-tls.log

    - name: Retirer les noms du lab de /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\s(app|api)\.lab\.test$'
        state: absent

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop:
        - 80
        - 443
        - 14000
        - 15000
        - 18097
