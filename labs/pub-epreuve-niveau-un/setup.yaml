---
- name: Préparer l'épreuve pub-epreuve-niveau-un
  hosts: lab_target
  become: true
  tasks:
    - name: Installer Docker, Compose et les outils du lab
      ansible.builtin.include_tasks: ../../shared/machine-docker.yml

    - name: Lire les images épinglées
      ansible.builtin.include_vars:
        file: ../../shared/images.yml
        name: socle_images

    - name: Préparer Pebble et les ressources ACME communes
      ansible.builtin.script: >-
        {{ playbook_dir }}/../pub-traefik-acme/fixtures/prepare.sh
      args:
        executable: /bin/bash
      environment:
        IMG_TRAEFIK: >-
          {{ socle_images.traefik.image }}:{{ socle_images.traefik.version
          }}@{{ socle_images.traefik.digest }}
        IMG_WHOAMI: >-
          {{ socle_images.whoami.image }}:{{ socle_images.whoami.version
          }}@{{ socle_images.whoami.digest }}
        IMG_PEBBLE: >-
          {{ socle_images.pebble.image }}:{{ socle_images.pebble.version
          }}@{{ socle_images.pebble.digest }}
        IMG_CHALLTESTSRV: >-
          {{ socle_images.challtestsrv.image
          }}:{{ socle_images.challtestsrv.version
          }}@{{ socle_images.challtestsrv.digest }}

    - name: Démarrer le chronomètre de l'épreuve
      ansible.builtin.command: date +%s
      register: debut_epreuve
      changed_when: false

    - name: Enregistrer l'heure de départ
      ansible.builtin.copy:
        dest: /opt/pub-traefik-acme/assessment-started-at
        content: "{{ debut_epreuve.stdout }}\n"
        owner: student
        group: docker
        mode: "0644"
