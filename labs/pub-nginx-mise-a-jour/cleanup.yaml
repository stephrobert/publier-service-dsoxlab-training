---
- name: Défaire le lab pub-nginx-mise-a-jour
  hosts: lab_target
  become: true
  tasks:
    - name: Arrêter les deux générations
      ansible.builtin.systemd:
        name: "pub-maj-app@{{ item }}.service"
        state: stopped
        enabled: false
      loop:
        - 1.4.2
        - 1.5.0
      failed_when: false

    - name: Arrêter Nginx
      ansible.builtin.systemd:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false

    - name: Retirer ce que le lab a déposé
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/pub-nginx-mise-a-jour
        - /etc/systemd/system/pub-maj-app@.service
        - /etc/nginx/conf.d/service.conf
        - /etc/nginx/conf.d/service.conf
        - /var/log/dsoxlab-pub-nginx-mise-a-jour.log

    - name: Recharger systemd après nettoyage
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Vérifier que les ports sont libérés
      ansible.builtin.wait_for:
        port: "{{ item }}"
        host: 127.0.0.1
        state: stopped
        timeout: 60
      loop:
        - 80
        - 443
        - 18111
        - 18112

- name: Retirer les sondes du client
  hosts: lab_client
  become: true
  tasks:
    - name: Les deux exécutables de mesure s'en vont avec le lab
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/sonde-courte
        - /usr/local/bin/flux-long
