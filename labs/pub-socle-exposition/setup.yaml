---
# Joué par `dsoxlab run` avant d'ouvrir la session : il pose la situation que
# le scénario décrit.
- name: Préparer le lab pub-socle-exposition sur edge
  hosts: lab_target
  become: true
  tasks:
    - name: Déposer les services
      ansible.builtin.copy:
        src: fixtures/app.py
        dest: /tmp/pub-socle-exposition-app.py
        mode: "0644"

    - name: Poser la situation initiale
      ansible.builtin.script: fixtures/prepare.sh
      args:
        executable: /bin/bash

- name: Préparer le client du lab pub-socle-exposition
  hosts: lab_client
  become: true
  tasks:
    - name: Installer curl
      ansible.builtin.apt:
        name: curl
        state: present
        update_cache: true
        cache_valid_time: 3600
