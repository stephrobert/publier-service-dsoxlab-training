# Surcharge française du catalogue. Elle ne porte QUE `repo.title`,
# `repo.description`, et les `title` / `description` des sections, appariés
# par `id` et non par position.
#
# La langue par défaut de l'outil est l'anglais : `meta.yml` porte donc
# l'anglais, et ce fichier le français. Sans lui, une session anglaise lit les
# titres de sections tels qu'ils sont écrits dans `meta.yml`.

repo:
  title: "Formation Publier un service web : un reverse proxy devant vos services, avec des certificats automatiques"
  description: |
    Les labs de la formation « Publier un service web ». L'apprenant place un
    reverse proxy devant de vrais services sur une seule machine virtuelle :
    il obtient un certificat automatiquement par ACME auprès d'une autorité de
    test (Pebble), puis publie des conteneurs derrière Traefik.

    Chaque lab est noté sur l'état du système, jamais sur les commandes
    tapées : les tests lisent le certificat réellement émis, les réponses que
    le proxy sert vraiment et les ports qui écoutent vraiment.

sections:
  - id: socle
    title: "Socle : comprendre et diagnostiquer un service publié"
    description: "Identifier le service derrière une réponse web, lire un échange HTTP, basculer un enregistrement DNS sans risque, puis obtenir un certificat automatiquement avec ACME."
  - id: traefik
    title: "Traefik : publier, protéger et exploiter un reverse proxy"
    description: "Publier des conteneurs et des services hôte derrière Traefik, sécuriser, observer, diagnostiquer et mettre à jour le point d'entrée, puis le prouver dans les deux épreuves de niveau."
  - id: haproxy
    title: "HAProxy : publier et exploiter des services web"
    description: "Publier en HTTPS avec l'ACME natif de HAProxy et l'observer avec Prometheus."
  - id: nginx
    title: "Nginx : publier et protéger des services web"
    description: "Publier une application avec Nginx et la protéger."
