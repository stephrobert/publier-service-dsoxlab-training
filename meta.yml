# yaml-language-server: $schema=https://raw.githubusercontent.com/stephrobert/dsoxlab/main/schemas/meta.schema.json
#
# Catalogue publier-service-dsoxlab-training, décrit par le contrat v1 de dsoxlab.
#
# Les labs de la formation « Publier un service web » du blog : un point
# d'entrée (Traefik, puis Nginx et HAProxy en option) devant des services, avec
# des certificats automatiques. Tout tourne sur UNE machine, en conteneurs.
#
# UN LAB ENTRE DANS CETTE LISTE LE JOUR OÙ IL EST ÉCRIT ET JOUÉ, PAS AVANT :
# `validate-structure` refuse un lab déclaré dont le `lab.yaml` n'existe pas.
# L'ordre pédagogique est porté par la liste ci-dessous, jamais par les noms
# de lab : on peut insérer un exercice sans renommer les suivants.
#
# `repo.id` sert de clé pour l'état local de ce catalogue : le changer
# déplace ces emplacements.
schema_version: 1

repo:
  id: publier-service-dsoxlab-training
  category: publier-service-dsoxlab-training
  title: "Publish a web service: a reverse proxy in front of your services, with automatic certificates"
  blog_url: "https://www.stephane-robert.info/docs/services/web/"
  description: |
    Labs for the "Publish a web service" course. Learners obtain and renew
    certificates from a test ACME authority (Pebble), publish containers behind
    Traefik, protect administration, and verify service recovery.

    Every lab is graded on the state of the system, never on the commands
    typed: the tests read the certificate that was actually issued, the
    responses the proxy really serves, and the ports that really listen.

# Où remettre une preuve d'apprentissage, si ce catalogue a un portail. En
# `https` : le lien porte les résultats d'un apprenant. dsoxlab n'envoie rien —
# il affiche une adresse, et l'apprenant décide.
#
# learning:
#   portal_url: https://formation.example.org/mon-apprentissage/

infra:
  provider: kvm
  # `lab-pub` donne le pont `virbr-pub`. CIDR pris : 10.10.20 a 90 ; 100 est
  # reserve a la future formation Base de donnees.
  network: lab-pub
  cidr: 10.10.110.0/24
  hosts:
    - name: edge.lab
      distro: debian13
      role: edge
      ram_mb: 4096
      vcpu: 2
      disk_gb: 20
    # Le client ne fait que consommer : dig, curl, openssl. Ajouté EN FIN DE LISTE,
    # l'IP et la MAC d'un hôte dérivant de sa position.
    - name: poste.lab
      distro: debian13
      role: poste
      ram_mb: 1024
      vcpu: 1
      disk_gb: 10
    # Le SECOND point d'entrée, et il ne sert qu'à `pub-haproxy-ha` : prouver
    # un domaine de panne demande deux machines, et une seule ne prouve que
    # la perte d'un processus.
    #
    # Ajouté EN FIN DE LISTE pour la même raison que `poste.lab` : l'IP et la
    # MAC d'un hôte dérivent de sa POSITION (`cidrhost(cidr, index + 11)`
    # dans le template KVM). L'insérer ailleurs décalerait l'adresse de
    # `poste.lab`, et tout ce qui la cite.
    #
    # Le prix est réel et se paie à chaque `provision` de ce catalogue : une
    # troisième VM, soit 7 Go de mémoire au total au lieu de 5. Les labs qui
    # n'en ont pas besoin la démarrent quand même, le contrat `infra:` étant
    # commun au dépôt.
    - name: edge2.lab
      distro: debian13
      role: edge
      ram_mb: 2048
      vcpu: 1
      disk_gb: 20

sections:
  - id: socle
    title: "Foundations: understand and diagnose a published service"
    description: "Identify the service behind a web response, read an HTTP exchange, switch a DNS record safely, and obtain a certificate automatically with ACME."
    labs:
      - pub-socle-service
      - pub-socle-http
      - pub-socle-dns
      - pub-acme-pebble
      - pub-socle-exposition
      - pub-socle-dns-http-tls
      - pub-socle-reverse-proxy
      - pub-socle-tls
      - pub-socle-application
      - pub-socle-flux-longs
      - pub-socle-disponibilite
      - pub-socle-observabilite
      - pub-socle-mise-en-service
      - pub-socle-depannage
      - pub-socle-securite
      - pub-socle-cache-delais
      - pub-epreuve-socle
  - id: traefik
    title: "Traefik: publish, protect and operate a reverse proxy"
    description: "Publish containers and host services behind Traefik, secure, observe, diagnose and upgrade the entry point, then prove it in the two level assessments."
    labs:
      - pub-traefik-modele
      - pub-traefik-installation
      - pub-traefik-docker
      - pub-traefik-fichier
      - pub-traefik-routage
      - pub-traefik-acme
      - pub-traefik-restart-recovery
      - pub-epreuve-niveau-un
      - pub-traefik-middlewares
      - pub-traefik-protection
      - pub-traefik-mtls
      - pub-traefik-flux-delais
      - pub-traefik-observabilite
      - pub-traefik-depannage
      - pub-traefik-mise-a-jour
      - pub-epreuve-niveau-deux
      - pub-traefik-zero-downtime
  - id: haproxy
    title: "HAProxy: publish and operate web services"
    description: "Publish HTTPS with HAProxy native ACME and observe it with Prometheus."
    labs:
      - pub-haproxy-tls
      - pub-haproxy-protection
      - pub-haproxy-observabilite
      - pub-haproxy-installation
      - pub-haproxy-routage
      - pub-haproxy-sante
      - pub-haproxy-tls-stable
      - pub-haproxy-confiance
      - pub-haproxy-stick-tables
      - pub-haproxy-flux-delais
      - pub-haproxy-runtime
      - pub-haproxy-depannage
      - pub-haproxy-mise-a-jour
      - pub-haproxy-ha
  - id: nginx
    title: "Nginx: publish and protect web services"
    description: "Publish an application with Nginx and protect it."
    labs:
      - pub-nginx-publication
      - pub-nginx-installation
      - pub-nginx-routage
      - pub-nginx-statique
      - pub-nginx-upstream
      - pub-nginx-tls
      - pub-nginx-limites
      - pub-nginx-flux-longs
      - pub-nginx-cache
      - pub-nginx-depannage
      - pub-nginx-mise-a-jour
      - pub-nginx-protection
      - pub-nginx-observation
